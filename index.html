<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2e7d32" />
    <title>Dạo Chơi Trong Rừng — Low Poly Isometric</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <div class="title">
        <h1>🌿 Dạo Chơi Trong Rừng</h1>
        <p>Low Poly &bull; Isometric &bull; Three.js</p>
      </div>
      <div class="controls-hint">
        <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
        <span class="or">hoặc</span>
        <span class="key">←</span><span class="key">↑</span><span class="key">↓</span><span class="key">→</span>
        <span class="label">để đi dạo &bull; kéo chuột để xoay góc nhìn &bull; lăn chuột để zoom</span>
      </div>
      <div class="stats">
        <div id="fps">60 FPS</div>
        <div id="pos">x: 0, z: 0</div>
      </div>
      <div class="seedbar">
        <span class="seed-label">🌍 Seed</span>
        <input id="seed" spellcheck="false" autocomplete="off" />
        <button id="newWorld" title="Tạo thế giới mới">🎲</button>
        <div id="chunks" class="chunks"></div>
      </div>
    </div>

    <div id="joystick"><div id="stick"></div></div>

    <!-- Mobile touch UI: zoom + sprint (chỉ hiện trên cảm ứng) -->
    <div id="touch-ui">
      <div class="zoom-btns">
        <button id="zoomIn" aria-label="Phóng to">＋</button>
        <button id="zoomOut" aria-label="Thu nhỏ">－</button>
      </div>
      <button id="btnSprint" aria-label="Chạy nhanh">🏃</button>
      <div id="mobile-hint">👈 chạm trái để đi &bull; 👉 vuốt phải để xoay &bull; pinch để zoom</div>
    </div>

    <div id="loading">
      <div class="loader">🌴</div>
      <p id="loadmsg">Đang trồng rừng...</p>
      <div class="loadbar"><div id="loadfill"></div></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
